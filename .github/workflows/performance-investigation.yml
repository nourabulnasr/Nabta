name: Verify first paint
on:
  push:
    branches: ['codex/nabta-phase-1']
    paths:
      - '.github/workflows/performance-investigation.yml'
      - 'scripts/performance/**'
      - 'worker.ts'
      - 'src/lib/first-paint.ts'
      - 'src/app/brand-intro.css'
      - 'src/app/globals.css'
      - 'src/components/motion/brand-intro.tsx'
      - 'vite.config.ts'
      - 'next.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://nabta.nourabulnasr.workers.dev
      SITE_INDEXABLE: 'true'
      NABTA_CLOUDFLARE: 'true'
      CONTEXT: production
      CHROME_PATH: /usr/bin/google-chrome
      LIGHTHOUSE_RUNS: '3'
      VERIFY_BASE_URL: http://127.0.0.1:3016
      VERIFY_SITE_URL: https://nabta.nourabulnasr.workers.dev
      VERIFY_INDEXABLE: 'true'
      VERIFY_OUTPUT: artifacts/performance/interactions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - name: Start isolated servers
        run: |
          mkdir -p artifacts/performance
          npx wrangler dev --config dist/server/wrangler.json --port 3016 > artifacts/performance/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3016/en > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check mascot sequence, skip, reduced motion and no JavaScript
        run: |
          node scripts/performance/trace-opening.mjs
          node scripts/verify-intro.mjs
          node scripts/performance/verify-opening.mjs
      - name: Check production response and SEO
        run: |
          node scripts/verify-deployment.mjs
          node scripts/verify-seo.mjs
      - name: Measure integrated production rendering
        run: node scripts/lighthouse.mjs artifacts/performance/baseline
      - name: Enforce the LCP budget in every run
        run: node scripts/performance/assert-budget.mjs artifacts/performance/baseline
      - name: Print exact values
        if: always()
        run: node scripts/performance/report.mjs
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-paint-comparison
          path: artifacts/performance
          retention-days: 14
