name: Validate release
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --experimental-strip-types scripts/verify-site-config.mjs
      - run: node scripts/audit-dependencies.mjs
      - run: node scripts/verify-learning-db.mjs
      - run: node --experimental-strip-types scripts/verify-learning-validation.mjs
      - run: npm run build:vinext
      - run: npm run security:scan -- --require-build


  live-quality:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/nabta-phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_BASE_URL: https://nabta.nourabulnasr.workers.dev
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/lighthouse.mjs artifacts/ci-live
      - run: node scripts/report-live-quality.mjs
