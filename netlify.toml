[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SITE_INDEXABLE = "false"

[context.production.environment]
  SITE_INDEXABLE = "true"
  SITE_URL = "https://nabta-ai-nour.netlify.app"

[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"

[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Explicit adapter registration is required for API-created projects: .next
# alone cannot serve dynamic pages, nonce middleware, or optimized images.
